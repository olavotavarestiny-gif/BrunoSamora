name: Deploy Supabase Edge Function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Login
        run: supabase login --token "${{ secrets.SUPABASE_ACCESS_TOKEN }}"

      - name: Set secrets (edge function)
        run: |
          supabase secrets set \
            --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
            CRM_PUSH_URL="https://solve-sqoh.onrender.com" \
            CRM_API_KEY="${{ secrets.CRM_API_KEY }}"

      - name: Deploy edge function
        run: |
          supabase functions deploy fit90-leads \
            --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"